name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes, diagrama UML e teste de fumaça
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (inclui o teste que confere o diagrama UML com o código)
        run: mvn -B verify
      - name: Teste de fumaça do jar
        run: |
          java -jar target/tres-em-um.jar &
          for i in $(seq 1 60); do curl -sf http://localhost:5260/health && break; sleep 1; done
          curl -sf http://localhost:5260/ | grep -q "<title>Três em Um</title>"
          curl -sf -c sessao.txt -b sessao.txt -X POST http://localhost:5260/api/musica/faixas/fur-elise/tocar | grep -q '"estado":"TOCANDO"'
          curl -sf -c sessao.txt -b sessao.txt -X POST -H 'Content-Type: application/json' -d '{"numero":"(27) 99901-2233"}' \
            http://localhost:5260/api/simulador/chamada-recebida | grep -q '"interrompida":true'

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t tres-em-um .
      - name: Teste de fumaça do contêiner
        run: |
          docker run -d -p 5260:5260 --name aparelho tres-em-um
          for i in $(seq 1 90); do curl -sf http://localhost:5260/health && break; sleep 1; done
          curl -sf http://localhost:5260/api/musica/biblioteca | grep -q "Ode à Alegria"
      - if: failure()
        run: docker logs aparelho
