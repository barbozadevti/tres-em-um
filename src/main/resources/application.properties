spring.application.name=tres-em-um
server.port=${PORT:5260}

# Cada visitante tem o próprio aparelho, guardado na sessão (sem banco de dados).
server.servlet.session.timeout=4h
server.servlet.session.persistent=false

management.endpoints.web.exposure.include=health
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.health=health

springdoc.swagger-ui.path=/swagger-ui.html

# O atalho liga para abrir o navegador sozinho.
tresemum.abrir-navegador=false

# Arquivos do site: o navegador sempre revalida (evita ver telas antigas depois de uma atualização).
spring.web.resources.cache.cachecontrol.no-cache=true
